# Essai sur Windows : tests automatisés, puis installation réelle (scripts de deploy/), recette du client par un robot,
# sauvegarde vérifiée et restauration. Les captures et le rapport sont publiés sur la branche « recette-windows ».
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests automatisés (Windows)
    runs-on: windows-latest
    env:
      SSI_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Démarrer PostgreSQL
        shell: pwsh
        run: |
          Get-Service -Name postgresql* | Set-Service -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe" -h localhost
      - name: Tests (hors scénario de sauvegarde bash, couvert par l'installation)
        run: dotnet test --filter "FullyQualifiedName!~ScenarioSauvegarde"

  recette:
    name: Installation et recette du client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Écran 1920 × 1080
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Démarrer PostgreSQL
        shell: pwsh
        run: |
          Get-Service -Name postgresql* | Set-Service -Status Running -StartupType Automatic
          & "$env:PGBIN\psql.exe" --version

      - name: Publier l'API et le client
        shell: pwsh
        run: |
          dotnet publish src/Ssi.Api -c Release -r win-x64 --self-contained -o deploy/publish/api
          dotnet publish src/Ssi.Client.Wpf -c Release -r win-x64 --self-contained -o deploy/publish/client

      - name: Simuler un autre logiciel déjà installé (port 5432 pris par le PostgreSQL du runner, port 5443 occupé)
        shell: pwsh
        run: |
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile -Command "$l = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Any, 5443); $l.Start(); Start-Sleep 7200"'
          Start-Sleep 3
          Get-NetTCPConnection -State Listen -LocalPort 5432, 5443 | Format-Table LocalAddress, LocalPort, OwningProcess

      - name: Installation d'essai sous Windows PowerShell 5.1 (deploy/Installer-SSI-essai.cmd → installer-essai.ps1)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force recette | Out-Null
          # Même chemin que l'utilisateur : Windows PowerShell 5.1, base SSI dédiée (binaires téléchargés), serveur + poste sur la même machine.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/installer-essai.ps1 -SansLancement *>&1 | Tee-Object -FilePath recette/installation-essai.log
          if ($LASTEXITCODE) { throw "installer-essai.ps1 en échec ($LASTEXITCODE)" }
          $fiche = Get-Content -Raw (Join-Path ([Environment]::GetFolderPath("Desktop")) "SSI - identifiants d'essai.txt")
          if ($fiche -notmatch "Mot de passe initial : (\S+)") { throw "Identifiants d'essai introuvables sur le bureau." }
          "SSI_ADMIN=$($Matches[1])" >> $env:GITHUB_ENV
          if ($fiche -notmatch "Serveur SSI : (https://localhost:(\d+))") { throw "Adresse du serveur absente de la fiche." }
          "SSI_API=$($Matches[1])" >> $env:GITHUB_ENV
          if ($Matches[2] -eq "5443") { throw "Le port 5443 était occupé : le serveur SSI aurait dû en choisir un autre." }
          if ($fiche -notmatch "port (\d+), dossier") { throw "Port de la base absent de la fiche." }
          if ($Matches[1] -eq "5432") { throw "Le port 5432 était occupé : la base SSI aurait dû en choisir un autre." }
          "SSI_PGPORT=$($Matches[1])" >> $env:GITHUB_ENV
          if ($fiche -notmatch "postgres / (\S+)") { throw "Mot de passe de la base SSI absent de la fiche." }
          "SSI_PGMDP=$($Matches[1])" >> $env:GITHUB_ENV
          Get-Service SSIApi, SSI-PostgreSQL | Format-List Name, Status, StartType | Out-File -Append recette/installation-essai.log
          Get-NetFirewallRule -DisplayName "SSI API*" | Get-NetFirewallAddressFilter | Format-List | Out-File -Append recette/installation-essai.log
          Get-Content "C:\Program Files\SSI\appsettings.json" | Out-File -Append recette/installation-essai.log
          # L'autre PostgreSQL (port 5432) n'a pas été touché : aucune base « ssi » n'y a été créée.
          $env:PGPASSWORD = "root"
          $intrus = & "$env:PGBIN\psql.exe" -X -A -t -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "SELECT count(*) FROM pg_database WHERE datname = 'ssi'"
          if ([int]$intrus -ne 0) { throw "Une base « ssi » a été créée dans le PostgreSQL déjà présent." }

      - name: Paquet d'installation d'essai
        shell: pwsh
        run: Compress-Archive -Path deploy/* -DestinationPath SSI-installation-essai.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SSI-installation-essai
          path: SSI-installation-essai.zip

      - name: Recette du client par le robot
        shell: pwsh
        run: dotnet run --project tools/Ssi.RecetteWindows -c Release -- "C:\Program Files\SSI\Ssi.Client.Wpf.exe" $env:SSI_API $env:SSI_ADMIN recette

      - name: Sauvegarde vérifiée (tâche planifiée) puis restauration dans une nouvelle base
        if: always()
        shell: pwsh
        run: |
          $journal = "recette/sauvegarde-restauration.log"
          $pgbin = "C:\SSI\PostgreSQL\pgsql\bin"
          Start-ScheduledTask -TaskName "SSI - Sauvegarde"
          do { Start-Sleep 5; $t = Get-ScheduledTask -TaskName "SSI - Sauvegarde" } while ($t.State -eq "Running")
          $info = Get-ScheduledTaskInfo -TaskName "SSI - Sauvegarde"
          "Tâche planifiée : dernier résultat $($info.LastTaskResult)" | Tee-Object -Append $journal
          Get-Content C:\SSI\Sauvegardes\sauvegardes.log -ErrorAction SilentlyContinue | Tee-Object -Append $journal
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; ProviderName = "SSI Sauvegarde" } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, LevelDisplayName, Message | Out-String | Tee-Object -Append $journal
          if ($info.LastTaskResult -ne 0) {
            # Diagnostic : même script, même rôle, même fichier pgpass, sous Windows PowerShell 5.1 mais avec le compte du poste.
            "--- Relance de diagnostic sous Windows PowerShell 5.1" | Tee-Object -Append $journal
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\SSI\Scripts\sauvegarder.ps1 -Dossier C:\SSI -PgBin $pgbin *>&1 | Tee-Object -Append $journal
            "Code de sortie : $LASTEXITCODE" | Tee-Object -Append $journal
          }
          $env:PGPASSWORD = $env:SSI_PGMDP
          & "$pgbin\psql.exe" -X -h 127.0.0.1 -p $env:SSI_PGPORT -U postgres -d ssi -c "SELECT horodatage, statut, fichier, taille, message FROM sauvegardes ORDER BY horodatage" | Tee-Object -Append $journal
          $dump = Get-ChildItem C:\SSI\Sauvegardes -Filter *.dump | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $dump) { throw "Aucun fichier de sauvegarde produit." }
          & C:\SSI\Scripts\restaurer.ps1 -Fichier $dump.FullName -Cible ssi_essai_restauration -PgBin $pgbin *>&1 | Tee-Object -Append $journal
          if ($LASTEXITCODE) { throw "Restauration en échec ($LASTEXITCODE)" }
          if ($info.LastTaskResult -ne 0) { throw "La sauvegarde planifiée a échoué ($($info.LastTaskResult))." }
          $verifiees = & "$pgbin\psql.exe" -X -A -t -h 127.0.0.1 -p $env:SSI_PGPORT -U postgres -d ssi -c "SELECT count(*) FROM sauvegardes WHERE statut = 'VERIFIEE'"
          if ([int]$verifiees -lt 1) { throw "La sauvegarde n'est pas inscrite comme vérifiée : l'alerte du tableau de bord resterait active." }

      - name: Rassembler les journaux
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force recette/journaux-serveur | Out-Null
          Copy-Item C:\SSI\Logs\* recette/journaux-serveur -ErrorAction SilentlyContinue
          "$(Get-Date -Format o) — commit $env:GITHUB_SHA — exécution $env:GITHUB_RUN_ID" | Out-File recette/LISEZMOI.txt

      - name: Désinstallation de l'essai (les autres logiciels restent intacts)
        if: always()
        shell: pwsh
        run: |
          $journal = "recette/desinstallation.log"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/desinstaller-essai.ps1 -Confirme *>&1 | Tee-Object -FilePath $journal
          if ($LASTEXITCODE) { throw "desinstaller-essai.ps1 en échec ($LASTEXITCODE)" }
          if (Get-Service SSIApi, SSI-PostgreSQL -ErrorAction SilentlyContinue) { throw "Un service SSI est encore présent." }
          if (Test-Path C:\SSI) { throw "C:\SSI est encore présent." }
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432 | Tee-Object -Append $journal
          if ($LASTEXITCODE) { throw "Le PostgreSQL déjà présent ne répond plus après la désinstallation." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-windows
          path: recette

      - name: Publier la recette sur la branche recette-windows
        if: always()
        shell: pwsh
        run: |
          Set-Location recette
          git init -q -b recette-windows
          git config user.name "SSI recette"
          git config user.email "recette@ssi.invalid"
          git add -A
          git commit -q -m "Recette Windows du commit $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" recette-windows
